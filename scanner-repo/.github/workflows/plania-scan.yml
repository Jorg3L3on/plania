# Private scanner. One job, daily at 09:00 UTC (3:00 AM Mexico City, no DST).
# gitleaks 8.30.1 linux-x64 archive sha256:
# 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
# The CLI is downloaded by src/scan/gitleaks.ts after the guard. This is not gitleaks-action.

name: plania-scan

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: plania-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List unmarked pull requests
        id: guard
        env:
          GH_TOKEN: ${{ secrets.PLANIA_SCAN_TOKEN }}
          SCRIPT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/plania-guard
          for name in select.mjs guard.mjs; do
            curl -fsSL \
              -H "Authorization: Bearer ${SCRIPT_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/src/${name}?ref=${GITHUB_SHA}" \
              -o "/tmp/plania-guard/${name}"
          done
          node /tmp/plania-guard/guard.mjs

      - name: Check out the scanner
        if: steps.guard.outputs.count != '0'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cache the gitleaks CLI
        if: steps.guard.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/plania/gitleaks
          key: gitleaks-8.30.1-${{ runner.os }}-${{ runner.arch }}

      - name: Set up Node 22
        if: steps.guard.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan unmarked heads
        if: steps.guard.outputs.count != '0'
        env:
          PLANIA_SCAN_TOKEN: ${{ secrets.PLANIA_SCAN_TOKEN }}
          PLANIA_SCAN_HASHES_JSON: ${{ secrets.PLANIA_SCAN_HASHES_JSON }}
          GH_TOKEN: ${{ secrets.PLANIA_SCAN_TOKEN }}
        run: node --experimental-strip-types src/run-queue.ts /tmp/plania-targets.json
